; Recommended additions to ReShade.ini in your MTGA folder (edit while Arena is closed).
; Key format for ReShade: <virtual-key code>,<ctrl>,<shift>,<alt>
[INPUT]
; Ctrl+Alt+Home = ReShade menu
KeyOverlay=36,1,0,1
; Ctrl+Alt+R = reload ReShade
KeyReload=82,1,0,1
; Ctrl+Alt+E = all effects on/off
KeyEffects=69,1,0,1

[3DGameBridge]
toggle_lens_key=0x32\;ctrl\;alt
toggle_3d_key=0x33\;ctrl\;alt
toggle_lens_and_3d_key=0x34\;ctrl\;alt
toggle_latency_mode_key=0x35\;ctrl\;alt
toggle_sr_key=0x31\;ctrl\;alt
